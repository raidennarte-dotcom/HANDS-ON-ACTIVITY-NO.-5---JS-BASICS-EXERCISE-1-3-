<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JS Exercise 1</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .input-group {
        margin-bottom: 10px;
      }
      label {
        display: inline-block;
        width: 150px;
      }
      button {
        margin-right: 5px;
        margin-top: 5px;
      }
      .results {
        margin-top: 15px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <h2>JS Exercise 1</h2>

    <div class="input-group">
      <label>Enter First Number:</label>
      <input type="number" id="num1" />
    </div>
    <div class="input-group">
      <label>Enter Second Number:</label>
      <input type="number" id="num2" />
    </div>

    <button onclick="calculate()">Calculate</button>
    <button onclick="clearCalc()">Clear</button>

    <div class="results">
      <div>Sum: <span id="sum"></span></div>
      <div>Difference: <span id="diff"></span></div>
      <div>Product: <span id="prod"></span></div>
      <div>Quotient: <span id="quot"></span></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
