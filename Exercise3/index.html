<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JS Exercise 3</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      button {
        margin-right: 5px;
        margin-top: 5px;
        margin-bottom: 15px;
      }
      .num-list {
        margin-bottom: 15px;
        min-height: 20px;
        line-height: 1.4;
      }
      .stats {
        font-weight: bold;
        line-height: 1.6;
      }
      .stat-blue {
        color: blue;
      }
      .stat-green {
        color: green;
      }
      .stat-red {
        color: red;
      }
    </style>
  </head>
  <body>
    <h2>JS Exercise 3</h2>

    <div>
      <label>Enter a Number:</label>
      <input type="number" id="numInput" />
    </div>

    <button onclick="insertNumber()">Insert</button>
    <button onclick="deleteAll()">Delete All</button>

    <div><strong>Numbers:</strong></div>
    <div id="numbersList" class="num-list"></div>

    <div class="stats">
      <div>Sum: <span id="sum" class="stat-blue"></span></div>
      <div>Highest: <span id="highest" class="stat-green"></span></div>
      <div>Lowest: <span id="lowest" class="stat-red"></span></div>
    </div>

    <!-- External JavaScript Link -->
    <script src="script.js"></script>
  </body>
</html>
